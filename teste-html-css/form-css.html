<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulário</title>
        <link rel="stylesheet" href="../css/form.css"/>
    </head>
    <body>
        
        <h2>Formulário de Cadastro</h2>
        <form class="form">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" 
            name="nome" placeholder="Digite seu nome" 
            required pattern="[A-Za-z]{3,20}" />
            
            <br/>

            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" minlength="3" maxlength="10"/>
            
            <br/>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" placeholder="Digite sua idade" pattern="[0-9]+" />

            <br/>

            <label for="telefone">Telefone</label>
            <input 
            type="tel"  
            id="telefone" 
            name="telefone" 
            placeholder="Digite no formato (00) 00000-0000" 
            pattern="\([0-9]{2}\)[0-9]{5}-[0-9]{4}"
            />
            
        

              <br/>

            <label for="email">E-mail:</label> 
            <input type="email" id="email" name="email" placeholder="seu-email@exemplo.com"/>
            
            <br/>
            
            <label for="senha">Senha:</label> 
            <input type="password" placeholder="Digite sua senha" id="senha" name="senha"/>

             <br/>
             <div class="container-botao">
                 <input type="submit" value="Enviar Formulário"/>
             </div>

        </form>

        <hr/>

        <h2>Formulário de Login</h2>
        <form class="form">
            <!-- <label for="email">E-mail:</label> -->
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" /> <br/>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha"/>  <br/>
            <input type="submit"/>
        </form>

        <hr/>

        <h2>Formulário de Pesquisa</h2>
        <form class="form-pesquisa">
            <label for="busca">Buscar produtos:</label>

            <div class="form-pesquisa-container-botao">
                <input type="search" id="busca" name="buscar" placeholder="Ex: pão francês" /> <br/>
                <button type="submit">Pesquisar</button>
            </div>
        </form>

        <hr/>
       
        <form>
            <label for="cor">Cor preferida: </label>
            <input type="color" id="cor" name="cor"/>

            <label for="nivel">Nível(0 a 5)</label>
            <input type="range" id="nivel" name="nivel" min="0" max="10"  />

        </form>

         <hr/>

         <h2>Campos de escolha</h2>
         <form>
            <h3>Quais tecnológias você conhece? (pode marcar mais de uma)</h3>

            <input type="checkbox" id="html" name="tecnologias" value="html"/>
            <label for="html">HTML</label>
            <br/>
            <input type="checkbox" id="css" name="tecnologias" value="css"/>
            <label for="css">CSS</label>
            <br/>
            <input type="checkbox" id="js" name="tecnologias" value="javascript"/>
            <label>Javascript</label>

            <h3>Qual o seu nível?</h3>
            <input type="radio" id="iniciante" name="nivel" value="iniciante"/>
            <label for="iniciante">Iniciante</label>

            <br/>

            <input type="radio" id="intermediario" name="nivel" value="intermediario"/>
            <label for="intermediario">Intermediário</label>

            <br/>

            <input type="radio" id="avancado" name="nivel" value="avancado"/>
            <label for="avancado">Avançado</label>

            <br/>
            <br/>

            <label for="curso">Escolha seu curso: </label>
            <select id="curso" name="curso">
                <option value="">--Selecione--</option>
                <option value="web">Programação Web</option>
                <option value="mobile">Desenvolvimento Mobile</option>
                <option value="dados">Análise de Dados</option>
            </select>

         </form>

         <h2> Caixa de mensagem </h2>
         <form>
            <label for="mensagem"> Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="10" cols="50" >
            </textarea>
         </form>
    </body>
</html>
